<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./../../css/card.css">
  <script src="../../p5.js"></script>
  <script src="dots.js"></script>
  <script src="confeti.js"></script>
  <style>
    .controls {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      color: white;
      font-family: Arial, sans-serif;
      min-width: 200px;
    }
    .preset-nav {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }
    .preset-nav button {
      background: #666;
      border: none;
      color: white;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .preset-nav button:hover {
      background: #888;
    }
    .preset-name {
      flex: 1;
      text-align: center;
      font-weight: bold;
    }
    .control-group {
      margin-bottom: 10px;
    }
    .control-group label {
      display: block;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-group input[type="checkbox"] {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <button id="backButton" onclick="window.history.back();">Back to Gallery</button>
  <h1>Confeti</h1>
  <p>Experimenting with generative art using circles of dots.</p>

  <div class="controls">
    <div class="preset-nav">
      <button onclick="previousPreset()">◀</button>
      <div class="preset-name" id="presetName">Classic</div>
      <button onclick="nextPreset()">▶</button>
    </div>

    <div class="control-group">
      <label for="frameRateSlider">Frame Rate: <span id="frameRateValue">2</span></label>
      <input type="range" id="frameRateSlider" min="1" max="30" value="2" oninput="updateFrameRate(this.value)">
    </div>

    <div class="control-group">
      <label for="circleSizeSlider">Spiral Size: <span id="circleSizeValue">125</span></label>
      <input type="range" id="circleSizeSlider" min="20" max="300" value="125" oninput="updateCircleSize(this.value)">
    </div>

    <div class="control-group">
      <label for="dotSizeSlider">Dot Size: <span id="dotSizeValue">16</span></label>
      <input type="range" id="dotSizeSlider" min="2" max="50" value="16" oninput="updateDotSize(this.value)">
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="randomCenterCheck" checked onchange="updateRandomCenter(this.checked)">
        Random Centers
      </label>
    </div>

    <div class="control-group">
      <label>
        <input type="checkbox" id="chaoticModeCheck" onchange="updateChaoticMode(this.checked)">
        Chaotic Mode
      </label>
    </div>
  </div>
</body>
</html>
