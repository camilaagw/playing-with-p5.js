<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js example</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./../../css/card.css">
  <script src="../../p5.js"></script>
  <script src="dots.js"></script>
  <script src="confeti.js"></script>
  <style>
    .preset-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .preset-nav button {
      background: none;
      border: none;
      color: #333;
      font-size: 28px;
      cursor: pointer;
      padding: 0;
    }
    .preset-nav button:hover {
      color: #000;
    }
    .preset-name {
      font-size: 24px;
      color: #333;
      min-width: 150px;
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="backButton" onclick="window.history.back();">Back to Gallery</button>
  <h1>Confeti</h1>
  <p>Experimenting with generative art using circles of dots.</p>

  <div class="preset-nav">
    <button onclick="previousPreset()">«</button>
    <div class="preset-name" id="presetName">Classic</div>
    <button onclick="nextPreset()">»</button>
  </div>
</body>
</html>
